<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Gestión de Publicaciones</title>
    <link rel="stylesheet" th:href="@{/styles/main.css}" />
</head>

<body>

<h1 th:text="${publicacionForm.id == null ? 'Alta de Publicación' : 'Edición de Publicación'}"></h1>

<div class="container">

    <div class="card">

        <form th:action="@{/publicaciones}"
              th:object="${publicacionForm}"
              method="post">

            <div th:if="${#fields.hasGlobalErrors()}">
                <p th:each="err : ${#fields.globalErrors()}"
                   th:text="${err}">
                </p>
            </div>

            <input type="hidden" th:field="*{id}">

            <div th:if="*{id != null}">
                ID:
                <input type="text"
                       th:field="*{id}"
                       readonly>
            </div>

            <div class="form-group">

                <label>Propiedad</label>

                <select th:field="*{idPropiedad}">
                <option value="" th:text="'Seleccione'"></option>

                    <option th:each="p : ${propiedades}"
                            th:value="${p.id}"
                            th:text="${p.direccion}">
                    </option>
                </select>

                <div class="error" th:errors="*{idPropiedad}"></div>

            </div>

            <div class="form-group">

                <label>Precio mensual</label>

                <input type="number"
                       step="0.01"
                       min="0.01"
                       th:field="*{precioMensual}">

                <div class="error" th:errors="*{precioMensual}"></div>

            </div>

            <div class="form-group">

                <label>Condiciones</label>

                <textarea th:field="*{condiciones}"></textarea>

                <div class="error" th:errors="*{condiciones}"></div>

            </div>

            <div class="form-group">

                <label>Descripción</label>

                <textarea th:field="*{descripcion}"></textarea>

                <div class="error" th:errors="*{descripcion}"></div>

            </div>

            <div class="form-group">

                <label>Fecha publicación</label>

                <input type="date"
                       th:field="*{fechaPublicacion}">

                <div class="error" th:errors="*{fechaPublicacion}"></div>

            </div>

            <div class="form-group" th:if="*{id != null}">

                <label>Estado</label>

                <select th:field="*{estado}">
                    <option value="">Seleccione</option>

                    <option th:each="e : ${T(tuti.desi.entidades.EstadoPublicacion).values()}"
                            th:value="${e}"
                            th:text="${e}">
                    </option>
                </select>

                <div class="error" th:errors="*{estado}"></div>

            </div>

            <div style="margin-top:25px;">

                <button class="btn btn-primary" type="submit">
                    Guardar
                </button>

                <a th:href="@{/publicaciones}"
                   class="btn btn-secondary">
                    Volver al listado
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
