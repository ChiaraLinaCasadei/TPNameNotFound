<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Listado de Propiedades</title>
	<link rel="stylesheet" th:href="@{/styles/main.css}" />
</head>


<body>

<h1>Propiedades</h1>

<div th:if="${mensajeExito}" style="color: green;">
    <p th:text="${mensajeExito}"></p>
</div>

<div th:if="${mensajeError}" style="color: red;">
    <p th:text="${mensajeError}"></p>
</div>

<a th:href="@{/propiedades/nueva}">
    Nueva Propiedad
</a>

<table border="1">

    <thead>
        <tr>
			<th>ID</th>
            <th>Dirección</th>
            <th>Ciudad</th>
            <th>Tipo</th>
            <th>Ambientes</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
    </thead>

    <tbody>

        <tr th:each="p : ${propiedades}">
			
			<td th:text="${p.id}"></td>

            <td th:text="${p.direccion}"></td>

            <td th:text="${p.ciudad.nombre}"></td>

            <td th:text="${p.tipo}"></td>

            <td th:text="${p.cantidadAmbientes}"></td>

            <td th:text="${p.estado}"></td>

            <td>

                <form th:action="@{'/propiedades/' + ${p.id} + '/eliminar'}"
                      method="post"
                      onsubmit="return confirm('¿Seguro que desea eliminar esta propiedad?');">

                    <button type="submit">
                        Eliminar
                    </button>

                </form>
				<a th:href="@{'/propiedades/' + ${p.id} + '/editar'}">
				    Editar
				</a>

            </td>

        </tr>

    </tbody>

</table>

</body>
</html>
